const DATA = [{"t":"אהבת האחדות - רומנטיקה","f":"ללא הקלטה","u":"files/ללא הקלטה/אהבת האחדות - רומנטיקה.pptx","s":2089557,"n":38,"d":"2026-10-18","im":"img/756eb68cef0a3885.webp","x":"? 1 רומנטיקה עם אלוקים 2 3 4 5 6 ר' יצחק הוטנר ה' אלול תש\"ל. תחילת זמן 'אלול' בישיבות. את אווירת ה'שטייגען' קוטעת שמועה ולפיה מטוס ובו יהודים חרדיים נחטף. הדיווחים בכלי התקשורת הכלליים הם לאקוניים, אך בהיכלי התורה מתפשטת השמועה. הגאון האדיר הרב יצחק הוטנר אשתו, בתו היחידה וחתנו הגאון רבי יונתן דיוויד היו על המטוס שנחטף. לימים תוכר החטיפה בשם 'חטיפת המטוסים לשדה דוסון'. מדובר היה בסדרה של חטיפות מטוסים שבוצעו במהלך אותו חודש על ידי ארגון שנודע בשם החזית העממית לשחרור פלסטין. החוטפים השתלטו על תא הטייס והודיעו \"מדבר הקברניט החדש שלכם. הטיסה נחטפה על ידי החזית העממית לשחרור פלסטין\". תוכניתם של החוטפים הייתה לחטוף שלושה מטוסים שהיו מיועדים להגיע לניו יורק. מתוכם הם הצליחו לחטוף שניים. המטוסים החטופים הונחתו בשדה התעופה זרקא, הידוע גם כשדה דוסון, מסלול המראה מדברי מבודד בירדן ששימש בעבר כבסיס חיל האוויר המלכותי הבריטי. הניסיון לחטוף גם את טיסת אל על 219 מאמסטרדם סוכל: אחד החוטפים, פטריק ארגואלו נורה על ידי המאבטחים, ושותפתו ליילה ח'אלד נעצרה והועברה לידי הרשויות הבריטיות בלונדון. שני חוטפים שנמנע מהם לעלות לטיסת אל על חטפו במקום זאת בואינג 747, העבירו את המטוס הגדול לביירות, ואז לקהיר במקום לשדה הירדני הקטן. במשך שנים נודע האירוע כ\"יום השחור של התעופה\". מטוס חמישי, מבחריין, נחטף מספר ימים לאחר מכן על ידי אוהד החזית העממית והובא גם הוא לשדה דוסון במטרה ללחוץ על הממשלה הבריטית לשחרר את ח'אלד. אנשי החזית העממית הפרידו את אנשי הצוות והנוסעים אזרחי ארצות הברית, ישראל, גרמניה ושווייץ והחזיקו אותם בשבי, בעוד ששאר החטופים הועברו לעמאן. רוב החטופים שוחררו, אך 56 הושארו כבני ערובה, ביניהם הישראלים ונוסעים שזוהו כיהודים. כאות לרצינות כוונותיהם פוצצו אנשי החזית העממית את המטוסים הריקים אל מול התקשורת העולמית. במקביל לפעולות השונות, בהיכלי התורה נאמרו מדי יום פרקי תהילים, בשטיבלאך היו משמרות תהילים לאורך כל שעות היממה שעות לימוד רבות הוקדשו לשחרור החטופים היהודיים ובראשם משפחת הוטנר. כל הפעולות נעש גר\"א בביאורו: כמו שכתוב \"איש צדיק תמים ... את האלוקים התהלך נח\", וכן בחנוך, וכן באבות \"אשר התהלכו אבותי לפניו\", וזהו כל מעלת הצדיקים. מדברי רמ\"א אלו מתברר, שהמצוה להרגיש את קרבת השי\"ת באופן תמידי, אינה רק פרט אחד מתוך הפרטים הרבים של עבודת ה', אלא מצוה מרכזית ביותר בתורה. ומדברי הגר\"א שכתב שהיא 'כל מעלת הצדיקים' רואים שהיא ההצלחה הרוחנית האמיתית היחידה בעולם הזה – ואם כן, ברור שהיא מטרת כל התורה וקיום מצוותיה והמגמה שהיא ייעוד חיינו. וצריך ברור מדוע זה כל כך דבר חשוב? ובכלל איך עושים את זה – כל הזמן לחשוב מי יכול? 2 והיו – על לבבך חובות הלבבות בפתיחה לשער היחוד כתב שמצות \"שויתי ה' לנגדי תמיד\" - שלא יחדל הלב מזכרון ה' תמיד, היא כוונת התורה במה שכתב \"והיו הדברים האלה אשר אנכי מצוך היום על לבבך\". כוונתו ש\"הדברים האלה\" היינו אחדות ה' ואהבת ה' המוזכרות קודם, יהיו תמיד \"על לבבך\". כל הדברים המוזכרים אח\"כ בפרשה מיועדים להביא לקיום מצוה אהבת ה'; שזו היא מטרת \"ושננתם לבניך ודברת בם בשבתך בביתך ובלכתך בדרך ובשכבך ובקומך\" ['שתהיה רגילות לשונו בהם תמיד מביאה לידי זכרון הלב, ולא יפנה לבבו מזכר האלהים תמיד'] 3 קריאת שמע מחשבה וְהָיוּ הַדְּבָרִים הָאֵלֶּה אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם עַל לְבָבֶךָ: דיבור וְשִׁנַּנְתָּם לְבָנֶיךָ וְדִבַּרְתָּ בָּם בְּשִׁבְתְּךָ בְּבֵיתֶךָ וּבְלֶכְתְּךָ בַדֶּרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶךָ: מעשה וּקְשַׁרְתָּם לְאוֹת עַל יָדֶךָ וְהָיוּ לְטֹטָפֹת בֵּין עֵינֶיךָ: וּכְתַבְתָּם עַל מְזֻזוֹת בֵּיתֶךָ וּבִשְׁעָרֶיךָ: שְׁמַע יִשְׂרָאֵל יְהֹוָה אֱלֹהֵינוּ יְהֹוָה אֶחָד: וְאָהַבְתָּ אֵת יְהֹוָה אֱלֹהֶיךָ בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ וּבְכָל מְאֹדֶךָ: 4 והיו לטוטפות כתב הרשב\"א: ולהניח אותם כעדי בין העינים, והוא אומרו והיו לטטפות בין עיניך, שיהיה הדבר תמיד בין עיניו, ושלא יעבור אפילו רגע. טוטפות עדויים (תכשיט). וכמו ששנינו בשבת (נז, א) ולא בטוטפת ולא בסרביטין. ולכתוב אותם על פתחי השערים, כדי שיהא הדבר תמיד בין עיניו, ושלא יעבור אפילו רגע מזכרוננו, וכדי שנתפאר ונתעדן בו: מבואר בדברי הרשב\"א חידוש נפלא: שמצוות \"שויתי ה' לנגדי תמיד\" המופיעה ברמ\"א בסימן א', וכדברי הגר\"א היא כל מעלת הצדיקים, היא מצווה דאוריתא הכתובה במילים: והיו לטוטפות בין עיניך. וז\"ל ספר ראשית חכמה (שער הקדושה - פרק ששי): כתב החסיד בחובות הלבבות (הקדמה לשער היחוד) בענין פירוש פרשת \"ואהבת\", שכל הדברים שנזכרו בפרשה כענין \"ושננתם לבניך ודברת בם\" (דברים ו' - ו'), כולם מעוררים האהבה, ואמר אחר כך \"וקשרתם לאות וגו'\", וכתב [החובות הלבבות] זה לשונו: ואחר כן נעתק מחובת האברים אל תפלה של יד ותפלה של ראש והמזוזה, וכולם גורמים לזכור את הבורא ולאהבו בלבב שלם ולכסוף לו, וכמו שאמר הכתוב בחוקי זכרון אהבת האוהבים (שיר השירים ח' - ו') \"שמני כחותם על לבך כחותם על זרועך וגו'\", ואמר (שם א' - י\"ג) \"צרור המור דודי לי בין שדי ילין\". עכ\"ל. 5 אותיות או סחרחורת במשנה ברורה מובאת עצה (או\"ח סימן א' ס\"ק ד') באופן קיומה של מצות 'שויתי ה' לנגדי תמיד', וזה לשונו: \"וכתבו בשם האר\"י ז\"ל שיצייר שם הוי\"ה תמיד נגד עיניו בניקוד יִרְאָה כזה יִ- הְ- וָ- ה וזהו סוד 'שויתי ה' לנגדי תמיד', וזה תועלת גדול לענין היראה.\" מי שיבדוק עצה זו, ימצא שרוב בני האדם אינם מסוגלים להשתמש בה באופן מעשי. כאשר הם מנסים להעלות צורות אותיות אלו לפני העיניים, לא יצליחו להחזיק את התמונה ליותר משניות ספורות – הציור תמיד יברח מהם וההשתדלות להחזיקו מול עיניהם תגרום להם רק לסחרחורת ולכאב ראש. מדוע זה קורה? 6 תדמית רגשית הסיבה לכך שאדם לא יכול לשים מול עיניו הרבה זמן את אותיות יקוק ברורה, לכל אדם יש הגנה נפשית נגד רגשות שאינם נעימים. כאשר תחושת \"שויתי ה' לנגדי\" יוצרת אצל האדם רגש של יראה ופחד בלבד, הנפש מטבעה תדחה את הציורים הגורמים לה רגשות כבדים ובלתי נעימים כאלו. התופעה השכיחה הזאת של יחס להשי\"ת המבוסס על יראה ופחד בלבד, היא תוצאה של העובדה שאנשים נוטים לחשוב ברצינות על השי\"ת ועל תכונותיו רק כאשר קורה אסון רח\"ל. כתוצאה מכך, מבלי לשים לב, נבנית תדמית רגשית עמוקה בלב האדם (שהיא הכרתו הרגשית בבורא העולם – \"ידיעת ה'\" שלו), שלפיה השי\"ת הוא זה שחולל את כל הדברים שקשה לנו לקבלם בחיים ואת כל האסונות האיומים. על כן, אותיות אלו של השם מעוררות אצלו רגשות בלתי נעימים של פחד וסלידה, ומתוך הרתעה נפ","id":"dada996b15","c":"שונות ואישי","b":"https://yudataub.github.io/matzgot-2/","v":true},{"t":"רומנטיקה עם אלוקים","f":"ללא הקלטה › שקופיות › הרצאות","u":"files/ללא הקלטה/שקופיות/הרצאו א כולם יחד, או כל אלה שתרמו מחצית השקל תרומת הלשכה שממנה נקנה הקרבן, הם הבעלים של \"קרבן ציבור\", אלא כנסת ישראל כחטיבה אחת, כאישיות אינדיבידואלית עצמית, ולא כסכום של כך וכך יחידים\". התהליך שלנו 5 ממלכת כהנים שכינה שורה במניין כוחו של ציבור \" וְאַ תֶּ ם תִּ הְ יּו לִּי מַ מְ לֶּכֶּת כֹּהֲנִּים וְגֹוי קָ דֹוׁש.\" ❖ ננסה להבין מעט את המשמעות התורנית של\"ממלכת כהנים\" , שזו המטרה של מתן תורה. ❖נמשול משל, ליהודי שרוצה להתפלל תפילת מנחה. הוא כמובן רוצה להתפלל במניין, הן \"כל ביה עשרה שכינתא שריה\". מעלת \"שכינתא שריא\" היא מעלה עצמית, ויש לה השלכות הלכתיות על הגדרת התפילה כתפילה בציבור, ורק כאשר היא קיימת מתקיים הפסוק \"ונקדשתי בתוך בני ישראל\" ואפשר לומר קדיש וקדושה. ❖הוא נכנס למקום ,והנה הוא רואה שם פגישה של גדולי עולם ! בחדר נמצאים הגאון מווילנא ,הבעל שם טוב ,האור החיים הקדוש , הבן איש חי ,החפץ חיים והחזון איש . הוא פונה אליהם ברטט ובזיע בשאלה אם חפצים הם להתפלל כעת מנחה . אך לצערם אין להם מניין . אין כאן\"ונקדשתי\" , חסר ב\"שכינתא שריא.\" ❖פונה היהודי למקום אחר , ופוגש שם עשרה יהודים הקרויים בפינו \"פשוטים .\"יהודים שלא קראו ולא שנו ולא שמשו תלמידי חכמים , ומעלתם המרכזית היא היותם זרע אברהם יצחק ויעקב . אלא שהם עשרה .כאן אפשר להתפלל במניין , כאן מתקיים\"ונקדשתי בתוך בני ישראל\" ,כאן אפשר לומר קדיש וקדושה , כאן\"שכינתא שריא.\" ❖הדבר מדהים ! ברור שכל אחד מהקבוצה הראשונה מעלתו רבה לעין ערוך . אך יש יתרון לבני הקבוצה השניה , כי יש כאן\"ציבור .\"שכינתא שריא בציבור ,ויחידים יכולים להיות קדושים ככל שיהיו , עדיין יש בחינה שרק בעשרה בישראל שכינתא שריא. התהליך שלנו 6 שכינה בכלל ישראל התורה ניתנה לאומה. התכלית– אומה בתורתה. מעלת כלל ישראל ❖ לעילא ולעילא לאין ערוך ,שכינתא שריא בכלל ישראל . כלל ישראל זה הרבה יותר מעשרה מישראל . ❖כלל ישראל זו מדרגה ציבורית עצומה של העם כולו , והשראת השכינה באומה כולה זו מדרגה שאף יחיד או אף קהילה אינם יכולים להגיע אליה . ❖ הדרך היחידה להגיע אליה היא כאשר עם ישראל ינהל את חייו כאומה בת חורין עם מלכות משלה\" .מַ מְ לֶכֶת כֹּהֲנִים.\" ❖התורה לא ניתנה לאבות הקדושים , למרות שאין לנו שום מושג בדרגתם ובגודל צדקתם .הם זכו להיות מרכבה לשכינה , מפיהם עם י x":"מדינה יהודית האם זה חזון של יהודי? האם יש מצווה להקים מדינה 1 מגילת העצמאות לפיכך נתכנסנו, אנו חברי מועצת העם, נציגי הישוב העברי והתנועה הציונית, ביום סיום המנדט הבריטי על ארץ־ישראל, ובתוקף זכותנו הטבעית וההיסטורית ועל יסוד החלטת עצרת האומות המאוחדות אנו מכריזים בזאת על הקמת מדינה יהודית בארץ־ישראל, היא מדינת ישראל. 2 מדינה יהודית האם מצאנו בתורה – מצווה/ענין/חשיבות – בהקמת מדינה? האם יש מקור בתורה לשלטון דמוקרטי? האם יהודים דתיים שאפו בכל הדורות להקים מדינה לעצמם? למה חילונים הקימו את המדינה? 3 אמצעי לקיום התורה תפיסה כזו, הרואה במדינה אמצעי, ולא מטרה, היא תפיסתו של הרב שמשון רפאל הירש (אגרות צפון, מכתב ה): ... התורה ומילוי רצון ה' הם יסוד חייו (של העם יהודי), הקרקע מתחת רגליו ומטרת קיומו, ועל כן אין לאומיותו תלויה בגורמים חולפים, ואין אלה משמשים תנאים הכרחיים לה. אבל על עם ישראל הוטל להתייצב כעם בין העמים, ובתור עם להראות לכל העמים שה' הוא השליט בעולמו, הטוב והמטיב לכל העולם כולו; שאם רק נתמסר למלאות את רצונו בחיינו, נקבל מידיו בשפע רב את אותם האמצעים שבני האדם רואים בהם ברכה, שהתמסרותנו לעבודת ה' יכולה לשמש יסוד איתן לכונן עליו את חיינו. ישראל רכש לו אמנם ארץ והקים לו ממלכה, אבל אלה לא עמדו כמטרה לנגד עיניו, אלא כאמצעים הדרושים לו כדי לקיים את מצוות התורה; ועל כן פריחת ארצו וקיום ממלכתו תלויים רק בשמירת התורה. ואכן, לפי השקפה זו, כאשר השלטון מושתת על ערכי דמוקרטיה, והרוב במדינה אינו אמון על קיום מצוות, ומוסדות הממשל אינם דואגים אך ורק לחינוך נאות, לקיום מצוות וללימוד תורה, אלא גם לצרכים של ציבור \"אחר\" - ובין השאר מבצעים פעולות שאינן עולות בקנה אחר עם הנדרש ע\"פ ההלכה - אזי אין כל מקום לקיומה של מדינה זו, ועדיף עליה חיים בצל הגויים, כאשר הם אלה הדואגים לכבישים ולגשרים, ולשאר הצרכים החומריים של התושבים, ולנו, ליהודים, מאפשרים - ולעתים אפילו מספקים - את כל הדרוש לנו לקיום החיים הרוחניים שלנו. 4 חמש דרשותיו של הרב יוסף דב סולובייצ'יק: אם מדינת ישראל הינה חלק מכריתת הברית האלקית עם אברהם, חלק מהגורל המסתורי של 'גר ותושב אנכי עמכם', אם מדינת ישראל תהיה טבעת בשרשרת הזהב של המסורה היהודית, אם היא סוללת את הדרך לאחרית הימים, כל הקרבנות כדאיים, כל המזבחות שבנינו כדי לייסד את מדינת ישראל קדושים ויקרים - 'ויבן שם מזבח ויקרא בשם ה'\". אולם אם מדינת ישראל תיהפך לממלכה חילונית, ללא תורה, ללא קדושה, ללא שבת, ללא חינוך דתי, ללא טהרת המשפחה; מדינה בה נשחק הייחוד היהודי - המחיר שאנו משלמים עבורה בדם ודמעות גדול יותר מדי. בכלל, כאמור לעיל, אם המדינה משליכה את הסיסמה של 'גר אנכי עמכם' ומסתפקת בפרזה של 'תושב אנכי עמכם', אינני יכול להסביר את חשיבותה לא לנכרים ולא ליהודים. 5 6 היחס הכפול של החרדים למדינה דומני כי היחס הכפול של החרדים למדינה משקף מורכבות פנימית של האידאולוגיה החרדית. מצד אחד, הציבור החרדי רואה בקיומה של המדינה היהודית משהו בעל משקל יהודי משמעותי. הקמת המדינה, ביחוד לאחר השואה, היתה בשורה גדולה לעם ישראל, בשורה יהודית ודתית. בדומה לכך, חווית החיים של האדם החרדי בארץ היא חוויה שיש בה שותפות ותחושה כללית של ביתיות. החרדי אינו מרגיש בגלות בארץ. אפילו החרדים האנטי-ציוניים ביותר מרגישים בארץ יותר בבית מבלונדון או בניו-יורק. מצד שני, דווקא קרבה זו מולידה תחושה עזה של ניכור בשל הצביון החילוני של המדינה. בה במידה שהמדינה היא בעלת משמעות עבור היהודי החרדי, מתעצמת הרתיעה והסלידה שלו מטקסים ממלכתיים זרים. הם זרים לרוחו ולשפתו, ופעמים רבות אף לאמונתו. כמו כן, הציבור החרדי מרגיש שהקול היהודי המסורתי מודר ומושתק על ידי קברניטי המדינה, והדבר מוליד אצלו תחושה של \"לא אל הנער הזה התפללתי\". השלילה האידאולוגית של המדינה אינה אפוא שלילה קרה; יש בה אכזבה וזעם ואולי אף תחושת בגידה. כללו של דבר, השניות ביחסו של החרדי למדינה היא תוצר של חוסר יכולת להכיל את חילוניותה של המדינה היהודית. כשם שהחילונים לא הצליחו עד היום להחליט כיצד יכולה מדינה להיות גם דמוקרטית וגם יהודית, כך החרדים אינם מצליחים להתמודד עם העובדה שהמדינה היא בו זמנית יהודית וחילונית. 7 מדינה יהודית האם זה חזון של יהודי? האם יש מצווה להקים מדינה 8 מצוות ירושת הארץ מצוות ישיבת ארץ ישראל מתחלקת לשלושה חלקים: א. מצוות ישיבת ארץ ישראל – מצווה על כל יהודי ויהודי לשבת בארצנו הקדושה. ב. מצוות ישוב ארץ ישראל – מצווה לדאוג שארץ ישראל תהיה מיושבת, גם אדם הגר לצערנו בחו''ל מצווה עליו לדאוג ליישב את ארץ ישראל בבתים עצים וכל דבר הגורם לישוב הארץ. ג. מצווה להשתדל שארץ ישראל תהיה בבעלות יהודית – ירושת const saveMarks = () => { try { localStorage.setItem("matzgot-marked", JSON.stringify([...marked])); } catch (e) {} };
const S = { topic: "", only: false };
const TOPICS = [["אהבת ה', שמחה ועונג", "💗"], ["זוגיות ומשפחה", "💞"], ["גאולה, ארץ ישראל ומדינה", "🗺️"], ["חגים ומועדים", "🕎"], ["הלכה", "⚖️"], ["פרשת השבוע", "📜"], ["השקפה ומחשבה", "💡"], ["חינוך והוראה", "🎓"], ["זקנה ובריאות", "🌿"], ["שונות ואישי", "🗂️"]];   // [name, emoji] in display order (topics.py)

const folders = {};
DATA.forEach(r => folders[r.f] = (folders[r.f] || 0) + 1);
$("stats").innerHTML = [
  `${DATA.length} מצגות`,
  `${DATA.reduce((a, r) => a + r.n, 0).toLocaleString("he-IL")} שקופיות`,
  `${Object.keys(folders).length} תיקיות`].map(s => `<span>${s}</span>`).join("");

function chips() {
  const cnt = {}; DATA.forEach(r => cnt[r.c] = (cnt[r.c] || 0) + 1);
  const all = [["", "הכול", DATA.length], ...TOPICS.filter(([t]) => cnt[t]).map(([t, e]) => [t, e + " " + t, cnt[t]])];
  $("chips").innerHTML = all.map(([k, l, n]) => `<button class="chip${S.topic === k ? " on" : ""}" data-f="${esc(k)}">${esc(l)} <small>${n}</small></button>`).join("");
}
function hl(s, words) {
  let h = esc(s);
  for (const w of words) if (w.length > 1) h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
  return h;
}
function snippet(r, words) {
  if (!r.x) return "";
  const w = words.find(w => r._x.includes(w));
  if (!w) return r.x.slice(0, 160);
  const i = Math.max(0, r._x.indexOf(w) - 60);
  return (i ? "…" : "") + r.x.slice(i, i + 170);
}
function card(r, words) {
  const m = marked.has(r.id);
  const view = /\.pdf$/i.test(r.u) ? `<a class="view" href="${fileUrl(r)}" target="_blank" rel="noopener">👁 צפייה</a>`   // a PDF opens in the browser (18.10)
    : r.v ? `<a class="view" href="https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(r.vu ? PAGES + r.vu : fileUrl(r))}" target="_blank" rel="noopener">👁 צפייה</a>` : "";
  return `<article class="card${m ? " marked" : ""}" data-id="${r.id}">
    <div class="thumb">${r.im ? `<img src="${r.im}" alt="" loading="lazy">` : `<div class="ph">🎞️</div>`}
      <button class="star" type="button" title="סימון לאתר" aria-label="סימון לאתר">${m ? "★" : "☆"}</button>
      ${r.n ? `<span class="badge">${r.n} שקופיות</span>` : ""}</div>
    <div class="body">
      <h3>${hl(r.t, words)}</h3>
      <div class="folder">${esc((TOPICS.find(t => t[0] === r.c) || ["", ""])[1])} ${esc(r.c)} · 📁 ${esc(r.f)} · ${mb(r.s)} · ${r.d.split("-").reverse().join(".")}</div>
      ${r.x ? `<div class="snip">${hl(snippet(r, words), words)}</div>` : ""}
      <div class="acts">${view}<a class="dl" href="${esc(fileUrl(r))}" download>⬇ הורדה</a></div>
    </div></article>`;
}
function draw() {
  const q = norm($("q").value).trim(), words = q.split(/\s+/).filter(Boolean);
  let list = DATA.filter(r => (!S.topic || r.c === S.topic) && (!S.only || marked.has(r.id)));
  if (words.length) list = list.filter(r => words.every(w => r._t.includes(w) || r._x.includes(w)));
  const by = $("sort").value;
  list = list.slice().sort((a, b) => {
    if (words.length) {   // the name before the slides
      const ta = words.every(w => a._t.includes(w)), tb = words.every(w => b._t.includes(w));
      if (ta !== tb) return tb - ta;
    }
    return by === "t" ? a.t.localeCompare(b.t, "he") : by === "n" ? b.n - a.n : b.d.localeCompare(a.d);
  });
  $("grid").innerHTML = list.length ? list.map(r => card(r, words)).join("") : `<div class="empty">לא נמצאה מצגת. נסו מילה אחרת או "הכול".</div>`;
  $("status").textContent = `${list.length} מצגות${S.topic ? " בנושא " + S.topic : ""}${words.length ? " · חיפוש: " + $("q").value : ""}`;
  $("onlyMarked").classList.toggle("on", S.only);
  $("onlyMarked").textContent = `${S.only ? "★" : "☆"} המסומנות (${marked.size})`;
  $("tray").style.display = marked.size ? "flex" : "none";
  $("trayN").textContent = `★ ${marked.size} מסומנות לאתר`;
}
$("q").addEventListener("input", draw);
$("sort").addEventListener("change", draw);
$("onlyMarked").onclick = () => { S.only = !S.only; draw(); };
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; S.topic = b.dataset.f; chips(); draw(); });
$("grid").addEventListener("click", e => {
  const s = e.target.closest(".star"); if (!s) return;
  const id = s.closest(".card").dataset.id;
  marked.has(id) ? marked.delete(id) : marked.add(id); saveMarks(); draw();
});
$("copy").onclick = () => {
  const txt = DATA.filter(r => marked.has(r.id)).map(r => `${r.t}  (${r.f})`).join("\n");
  navigator.clipboard.writeText(txt).then(() => { $("copy").textContent = "✓ הועתק"; setTimeout(() => $("copy").textContent = "📋 העתקת הרשימה", 1600); });
};
$("clear").onclick = () => { marked.clear(); saveMarks(); S.only = false; draw(); };
chips(); draw();
</script>
</body>
</html>
